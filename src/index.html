<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <title>Sports in Paradise — Sports retreats in Bali</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Coached padel, tennis, golf, diving and hiking weeks in Bali. Pick a sport, build the week you want, and talk to the people who run it.">
  <!-- Safari reads these before any stylesheet, and uses them for the area
       outside the page (the overscroll underlay) as well as the browser
       chrome. The JS below keeps them in step with an explicit toggle. -->
  <meta name="theme-color" content="#d4405f" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d0a10" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <!-- every photo comes from here; NgOptimizedImage expects the early connection -->
  <link rel="preconnect" href="https://images.unsplash.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <!-- both themes sit in the cache so swapping between them costs no round trip -->
  <link rel="preload" as="style" href="theme-light.css">
  <link rel="preload" as="style" href="theme-dark.css">
  <link id="theme-css" rel="stylesheet" href="theme-light.css">
  <script>
    (function () {
      // Which site is this? Mirrors SiteService, so the sport's palette is
      // the first thing painted rather than a flash of the hub's.
      var sports = ['padel', 'tennis', 'golf', 'diving', 'hiking'];
      var site = 'hub';
      var first = location.hostname.split('.')[0];
      var asked = new URLSearchParams(location.search).get('site');
      var kept = null;
      try { kept = sessionStorage.getItem('sip-site'); } catch (e) {}
      if (asked === 'hub' || sports.indexOf(asked) > -1) site = asked;
      else if (sports.indexOf(first) > -1) site = first;
      else if (sports.indexOf(kept) > -1) site = kept;
      document.documentElement.setAttribute('data-sport', site);

      var stored = null;
      try { stored = localStorage.getItem('sip-theme'); } catch (e) {}
      var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      var theme = stored === 'dark' || stored === 'light' ? stored : (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
      // applied here too, so the UA paints its own surfaces in the right
      // scheme from the very first frame, before styles.css is parsed
      document.documentElement.style.colorScheme = theme;
      // One link whose href changes, rather than two links toggled through
      // `media` or `disabled`: WebKit does not reliably start applying a
      // stylesheet that was inert when the document loaded.
      var link = document.getElementById('theme-css');
      if (link) link.href = theme === 'dark' ? 'theme-dark.css' : 'theme-light.css';
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
